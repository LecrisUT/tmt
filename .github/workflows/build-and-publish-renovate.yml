name: Build and publish renovate image
on:
  push:
    paths:
      - containers/Containerfile.renovate
  workflow_dispatch:
    inputs:
      ref:
        description: Committish to build and publish
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: redhat-actions/buildah-build@v3
        with:
          image: renovate-tmt
          containerfiles: ./containers/Containerfile.renovate
      - uses: redhat-actions/push-to-registry@v3
        with:
          image: renovate-tmt
          tags: latest
          registry: ghcr.io/lecrisut
          username: ${{ github.actor }}
          password: ${{ github.token }}
